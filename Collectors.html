<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- El logo se queda aquí arriba para el móvil -->
    <div class="icon">
        <img src="resources/iconadapted.svg" alt="Logo">
        <span class="icon-text">Collector</span>
    </div>

    <!-- Barra de navegación con tus botones -->
    <nav class="nav-bar">
        <div class="nav-buttons-container">
            <a class="nav-button" href="index.html">
                <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Feed</span>
            </a>
            
            <a class="nav-button" href="collectors.html">
                <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Collectors</span>
            </a>
           
            <a class="nav-button" href="#Buscar">
                <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <span>Buscar</span>
            </a>
            
            <a class="nav-button" href="#Perfil">
                <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Perfil</span>
            </a>
        </div>
    </nav>

    <main class="collector-page"> 
        <div class="collectors">
            <div class="u-follow"><h1>Collectors que sigues</h1>
                <div class="contenedor-bento">
                    <div class="bento">
                        <div class="bento-user">
                            <div class="subbento-avatar">
                                <div class="avatar"><img src="resources/DEFAULTUSER.png" alt="Avatar"></div>
                                <div class="bento-username">@username</div>
                            </div>
                            <div class="bento-follow"><button type="button">Seguir</button></div>
                        </div>
                        <div class="bento-title"><h2>Título de la colección</h2></div>
                        <div class="bento-cd">
                            <div class="bento-cdcover"></div>
                            <div class="bento-cdcover"></div>
                            <div class="bento-cdcover"></div>
                            
                            
                            
                        </div>
                    </div>
                </div>
            </div>
            <div class="separador-uno"></div>

            <div class="u-like"><h1>Collectors que te pueden gustar</h1>
                <div class="contenedor-bento">
                    <div class="bento">
                        <div class="bento-user">
                            <div class="subbento-avatar">
                                <div class="avatar"><img src="resources/DEFAULTUSER.png" alt="Avatar"></div>
                                <div class="bento-username">@username</div>
                            </div>
                            <div class="bento-follow"><button type="button">Seguir</button></div>
                        </div>
                        <div class="bento-title"><h2>Título de la colección</h2></div>
                        <div class="bento-cd">
                            <div class="bento-cdcover"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
