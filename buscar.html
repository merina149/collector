<main class="buscar-seccion">

<div class="buscar">
    <h1>Buscar</h1>
    <form class="searcher" action="search" method="GET">
    <input type="search" class="buscador" name="q" placeholder="Busca un álbum, artista o collector" required>
    <button type="submit" class="buscador1"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.3-4.3"/>
        </svg></button>
    </form>

    <input class="tab" type="radio" name="tab-buscar" id="tab-albumes" checked>
    <input class="tab" type="radio" name="tab-buscar" id="tab-artistas">
    <input class="tab" type="radio" name="tab-buscar" id="tab-collectors">
 
    <div class="filtro-tabs">
    <label class="tab" for="tab-albumes">Álbumes</label>
    <label class="tab" for="tab-artistas">Artistas</label>
    <label class="tab" for="tab-collectors">Collectors</label>
  </div>

<div class="para-empezar">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="rgba(56, 56, 56, 1)" stroke-width="1.5
        " stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.3-4.3"/>
        </svg>
    <h2>Busca algo para empezar</h2>
