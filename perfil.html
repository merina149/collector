<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collector</title>
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" href="resources/iconDEF.png">
</head>
<body>

    <!-- El logo se queda aquí arriba para el móvil -->
    <div class="icon">
        <img src="resources/iconadapted.svg" alt="Logo">
        <span class="icon-text">Collector</span>
    </div>

    <!-- Barra de navegación con tus botones -->
    <nav class="nav-bar">
        <div class="nav-buttons-container">
            <a class="nav-button" href="index.html">
                <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Feed</span>
            </a>
            
            <a class="nav-button" href="collectors.html">
                <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Collectors</span>
            </a>
           
            <a class="nav-button" href="buscar.html">
                <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <span>Buscar</span>
            </a>
            
            <a class="nav-button" href="perfil.html">
                <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Perfil</span>
            </a>
        </div>
    </nav>
    <main class="perfil">
        <div class="user-info">
            <div class="user-basics">
                <div class="avatar"><img src="resources/DEFAULTUSER.png"></div>
                <div class="info-perfil">
                    <h2>@mairena.ca</h2>
                    <p>St Bride Printing Library in London, took a 1914 Cicero translation and scrambled it to make dummy text for Letraset's Body Type sheets.</p>
                </div>
            </div>
            <button type="button"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="3"/>
                                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                                    </svg>
            </button>
        </div>
        <div class="insights">
            <button class="insights-button">
                <h2>27</h2>
                <p>Álbumes</p>
            </button>
            <button class="insights-button">
                <h2>4</h2>
                <p>Colecciones</p>
            </button>
            <button class="insights-button">
                <h2>132</h2>
                <p>Seguidores</p>
            </button>
            <button class="insights-button">
                <h2>89</h2>
                <p>Siguiendo</p>
            </button>

        </div>
        <button type="button" class="editar">Editar perfil</button>
        <div class="favoritos">
            <div class="fav-edit">
                <h2>Favoritos</h2>
                <button id="editar" type="button">Editar</button>
            </div>    
            <div class="bento-cd">
                            <a href="#miModal" class="portada-enlace"><div class="bento-cdcover"></div></a>
                            <a href="#miModal" class="portada-enlace"><div class="bento-cdcover"></div></a>
                            <a href="#miModal" class="portada-enlace"><div class="bento-cdcover"></div></a>
                            <a href="#miModal" class="portada-enlace"><div class="bento-cdcover"></div></a>
            </div>
        </div>
        <div class="aca">
            <input class="tab" type="radio" name="tab-buscar" id="tab-albumes" checked>
            <input class="tab" type="radio" name="tab-buscar" id="tab-artistas">
            <input class="tab" type="radio" name="tab-buscar" id="tab-colecciones">
 
    <div class="filtro-tabs">
    <label class="tab" for="tab-albumes">Álbumes</label>
    <label class="tab" for="tab-artistas">Artistas</label>
    <label class="tab" for="tab-colecciones">Colecciones</label>
        </div>
    </main>
<!-- esto es el modal -->
    <div id="miModal" class="modal-fondo">
    <div class="modal-contenido">
        <!-- Este botón redirige a '#' (ningún sitio), lo que cierra el modal -->
        <a href="#" class="cerrar-modal">&times;</a>

        <div class="modal-cover"><svg xmlns="http://w3.org" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <!-- Círculo exterior del disco -->
            <circle cx="12" cy="12" r="10" />
        <!-- Círculo interior (el agujero central) -->
            <circle cx="12" cy="12" r="2" />
        <!-- Línea curva de brillo o surco del disco -->
            <path d="M6 12a6 6 0 0 1 6-6" />
        </svg>
        </div>
        <div class="resto-modal" >
        <div class="titulo-artistas">
        <h2>Título del álbum</h2>
        <p>Artista · Año</p>
            <div class="estrellas">
                 <span>●</span><span>○</span><span>○</span><span>○</span><span>○</span>
            </div>
        </div>

            <div class="botones-modal">
                    <button type="button" class="escuchado" checked>
                        <svg xmlns="http://w3.org" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg> Escuchado
                    </button>
                    <button type="button" class="en-cola">
                      <svg xmlns="http://w3.org" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg> En cola
                    </button>
            </div>
            <textarea class="modal-review" placeholder="Escribe qué te ha parecido este álbum..."></textarea>
            <hr class="separador">
            <div class="fav-save">
                <button type="button">
                    <svg xmlns="http://w3.org" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                    </svg> Favorito</button>
                <button type="button"><svg xmlns="http://w3.org" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
                        </svg> Añadir a colección</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
